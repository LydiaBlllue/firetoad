# The live demo: the demo owner's page, published as it is committed, behind a front page in
# English and Chinese that says what the tool is, so a search can find it, with the demo one click
# away. docs/site/make.py builds the site; dashboards/ is what the template and findata/ build (T1),
# so nothing is rebuilt here. The site's own address goes into the pages and sitemap.xml, so a fork
# publishes its own address, not this one. robots.txt, naming the sitemap, is written only when the
# site has a domain of its own: search engines read it only at the domain's root, never under
# /<repo>/.
name: Live demo

# Every push to main redeploys, whatever it changed (2026-10-29, user 001): a release is a
# release, and the demo is never left on an older build than the repository says it is.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - run: python3 docs/site/make.py _site --base "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
